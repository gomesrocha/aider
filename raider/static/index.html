<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raider - Local AI Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Raider</h1>
            <div class="space-x-4">
                <button onclick="showView('dashboard')" class="hover:underline font-medium">Dashboard</button>
                <button onclick="showView('settings')" class="hover:underline font-medium">Settings</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 mt-6 max-w-4xl">
        <!-- Settings View -->
        <div id="settings" class="view hidden bg-white p-6 rounded shadow">
            <h2 class="text-xl font-bold mb-4">API Settings</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">OpenAI API Key</label>
                    <input type="password" id="openai_key" class="w-full border rounded p-2" placeholder="sk-...">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Anthropic API Key</label>
                    <input type="password" id="anthropic_key" class="w-full border rounded p-2" placeholder="sk-ant-...">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Gemini API Key</label>
                    <input type="password" id="gemini_key" class="w-full border rounded p-2" placeholder="AIzaSy...">
                </div>
                <button onclick="saveSettings()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save Settings</button>
            </div>
            <p id="settings-msg" class="mt-2 text-green-600 hidden">Settings saved!</p>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard" class="view bg-white p-6 rounded shadow hidden">
            <h2 class="text-xl font-bold mb-4">Start New Task</h2>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Target Directory (Workspace)</label>
                    <input type="text" id="target_dir" class="w-full border rounded p-2" placeholder="/home/user/my_project">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Target Files (Optional)</label>
                    <input type="text" id="target_files" class="w-full border rounded p-2" placeholder="src/main.rs, Cargo.toml (comma separated)">
                    <p class="text-xs text-gray-500 mt-1">Leave blank to read all files (respects .gitignore)</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Provider</label>
                    <select id="provider" class="w-full border rounded p-2">
                        <option value="openai">OpenAI</option>
                        <option value="anthropic">Anthropic</option>
                        <option value="gemini">Gemini</option>
                        <option value="ollama">Ollama (Local)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Model Name</label>
                    <input type="text" id="model_name" class="w-full border rounded p-2" value="gpt-4o">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Prompt</label>
                <textarea id="prompt" rows="4" class="w-full border rounded p-2" placeholder="Refactor the `main` function to use async/await..."></textarea>
            </div>

            <button id="start-btn" onclick="startAgent()" class="w-full bg-green-600 text-white px-4 py-2 rounded font-bold hover:bg-green-700">
                Start Agent
            </button>

            <!-- Status Panel -->
            <div id="status-panel" class="mt-8 hidden">
                <h3 class="text-lg font-bold mb-2">Task Status: <span id="task-state" class="text-blue-600">Pending</span></h3>
                <div class="bg-gray-900 text-green-400 font-mono text-sm p-4 rounded h-64 overflow-y-auto" id="logs-container">
                    <!-- Logs will appear here -->
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
